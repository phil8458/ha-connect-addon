worker_processes 1;
error_log stderr warn;
pid /tmp/ha-remote-nginx.pid;
user root;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:18123;
        server_name _;

        location / {
            # Upstream filled by ha-remote.sh via include or sed – default HA
            include /data/nginx-upstream.conf;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # frp always injects X-Forwarded-*; HA returns 400 without trusted_proxies.
            # Empty value = do not pass header to Home Assistant.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
